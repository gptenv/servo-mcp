name: CI and production deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - uses: actions/cache@v4
        with:
          path: ~/.cache/servo-puppeteer
          key: servo-widget-chrome-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Enable headless widget tests
        run: |
          node --input-type=module <<'JS'
          import { install } from '@puppeteer/browsers';
          import { PUPPETEER_REVISIONS } from 'puppeteer-core';
          import { appendFileSync } from 'node:fs';
          import { homedir } from 'node:os';
          import { join } from 'node:path';
          const browser = 'chrome-headless-shell';
          const binary = await install({ browser, buildId: PUPPETEER_REVISIONS[browser], cacheDir: join(homedir(), '.cache/servo-puppeteer') });
          appendFileSync(process.env.GITHUB_ENV, `CHROME_PATH=${binary.executablePath}\n`);
          JS
      - run: npm test

  deploy-worker:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run deploy:dry-run
      - run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
