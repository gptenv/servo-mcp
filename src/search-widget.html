<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servo web search</title>
<style>
  :root { color-scheme: light dark; font: 14px/1.45 system-ui, sans-serif; }
  /* Keep intrinsic content sizing independent of the host iframe viewport. */
  body { margin: 0; padding: 16px; display: flow-root; overflow-wrap: anywhere; }
  *, *::before, *::after { box-sizing: border-box; }
  input, textarea, select { min-width: 0; max-width: 100%; }
  form { display: flex; flex-wrap: wrap; gap: 8px; }
  input, select, button { font: inherit; padding: 8px; }
  input { flex: 1; min-width: 0; }
  button { cursor: pointer; }
  button:disabled { cursor: progress; }
  #status { min-height: 1.5em; }
  ol { padding-left: 1.4rem; }
  li { margin: 0 0 12px; }
  a { font-weight: 600; }
  .snippet { margin: 3px 0 0; opacity: .85; }
</style>
<main>
  <h1>Servo web search</h1>
  <form id="search-form">
    <label for="provider">Search engine</label><select id="provider"><option value="auto">Auto (Brave prioritized)</option><option value="brave">Brave</option><option value="google">Google</option><option value="bing">Bing</option><option value="duckduckgo">DuckDuckGo</option><option value="yandex">Yandex</option><option value="all">All engines</option></select>    <label for="query">Search query</label><input id="query" type="search" placeholder="Search the web" autocomplete="off" required>
    <button id="search" type="submit">Search</button>
  </form>
  <p id="status" role="status"></p>
  <ol id="results"></ol>
</main>
<script>
  const pending = new Map();
  const buffered = [];
  let nextId = 1;
  let accepting = false;
  let bridgeReady = false;
  let bridgeInitialized = false;
  let readyResolve = () => {};
  const ready = new Promise((resolve) => { readyResolve = resolve; });
  const queryField = document.querySelector('#query');
  const providerField = document.querySelector('#provider');
  const searchButton = document.querySelector('#search');
  queryField.addEventListener('input', () => { queryField.dataset.userEdited = '1'; });
  providerField.addEventListener('change', () => { providerField.dataset.userEdited = '1'; });
  function post(message) {
    if (!window.parent || window.parent === window) return;
    window.parent.postMessage(message, '*');
  }
  function withDeadline(promise, timeoutMs) {
    let timer;
    const timeout = new Promise((_, reject) => {
      timer = setTimeout(() => reject(Object.assign(new Error('Host request timed out.'), { code: 'HOST_TIMEOUT' })), timeoutMs);
    });
    return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
  }
  function call(method, params, timeoutMs) {
    const id = nextId++;
    const response = new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      post({ jsonrpc: '2.0', id, method, params });
    });
    return withDeadline(response, timeoutMs).finally(() => pending.delete(id));
  }
  let lastHeight = 0;
  let sizeFrame = 0;
  const sizeObserver = new ResizeObserver(() => reportSize());
  sizeObserver.observe(document.body);
  function reportSize() {
    if (!bridgeReady || sizeFrame) return;
    sizeFrame = requestAnimationFrame(() => {
      sizeFrame = 0;
      // scrollHeight on the root is at least the iframe's allocated height:
      // reporting it back prevents shrinking and feeds host layout changes back.
      const height = Math.ceil(document.body.getBoundingClientRect().height);
      if (height <= 0 || height === lastHeight) return;
      lastHeight = height;
      // A host controls width. Use only the negotiated sizing transport.
      if (bridgeInitialized) {
        post({ jsonrpc: '2.0', method: 'ui/notifications/size-changed', params: { height } });
      } else if (typeof window.openai?.notifyIntrinsicHeight === 'function') {
        try { window.openai.notifyIntrinsicHeight(height); } catch { /* Optional host hint. */ }
      }
    });
  }
  function stopSizeReporting() {
    bridgeReady = false;
    sizeObserver.disconnect();
    cancelAnimationFrame(sizeFrame);
    sizeFrame = 0;
  }
  window.addEventListener('pagehide', stopSizeReporting);

  function applyInput(params) {
    const supplied = params?.arguments ?? params ?? {};
    const input = Array.isArray(supplied.actions) ? supplied.actions[0] ?? {} : supplied;
    if (input.query && queryField.dataset.userEdited !== '1') queryField.value = input.query;
    if (input.provider && providerField.dataset.userEdited !== '1') providerField.value = input.provider;
  }
  function render(result) {
    const list = document.querySelector('#results');
    list.replaceChildren();
    if (!result) return;
    const entries = Array.isArray(result.responses) ? result.responses : null;
    const results = entries
      ? entries.filter((entry) => entry.ok).flatMap((entry) => entry.response?.results ?? [])
      : result.results ?? [];
    const failed = entries ? entries.filter((entry) => !entry.ok) : [];
    document.querySelector('#status').textContent = results.length
      ? results.length + ' result' + (results.length === 1 ? '' : 's')
        + (entries ? ' across ' + entries.length + ' search action' + (entries.length === 1 ? '' : 's') : '')
      : failed.length ? failed.map((entry) => entry.error ?? 'Search failed').join('; ') : 'No results found.';
    for (const item of results) {
      const li = document.createElement('li');
      const link = document.createElement('a');
      link.href = item.url;
      link.textContent = item.title;
      link.target = '_blank';
      link.rel = 'noreferrer';
      const snippet = document.createElement('p');
      snippet.className = 'snippet';
      snippet.textContent = item.snippet || '';
      li.append(link, snippet);
      list.append(li);
    }
    reportSize();
  }
  function handle(message) {
    if (message.method === 'ui/notifications/tool-input' || message.method === 'ui/notifications/tool-input-partial') applyInput(message.params);
    if (message.method === 'ui/notifications/tool-result') render(message.params?.structuredContent);
    if (message.method === 'ui/notifications/tool-cancelled') document.querySelector('#status').textContent = message.params?.reason || 'The search was cancelled.';
  }
  window.addEventListener('message', (event) => {
    if (event.source !== window.parent || event.source === window) return;
    const message = event.data;
    if (!message || message.jsonrpc !== '2.0') return;
    if (message.id !== undefined && pending.has(message.id)) {
      const request = pending.get(message.id);
      pending.delete(message.id);
      if (message.error) request.reject(Object.assign(new Error(message.error.message || 'Host request failed.'), { code: message.error.code }));
      else request.resolve(message.result);
      return;
    }
    if (message.id !== undefined && (message.method === 'ping' || message.method === 'ui/resource-teardown')) {
      if (message.method === 'ui/resource-teardown') stopSizeReporting();
      post({ jsonrpc: '2.0', id: message.id, result: {} });
      return;
    }
    if (!message.method) return;
    if (!accepting && String(message.method).startsWith('ui/notifications/')) { buffered.push(message); return; }
    handle(message);
  });
  function finishConnect() {
    bridgeReady = true;
    accepting = true;
    for (const message of buffered.splice(0)) handle(message);
    readyResolve();
    reportSize();
  }
  async function connect() {
    try {
      await call('ui/initialize', {
        appInfo: { name: 'Servo web search', version: '0.5.1' },
        appCapabilities: { availableDisplayModes: ['inline'] },
        protocolVersion: '2026-01-26',
      }, 8_000);
      bridgeInitialized = true;
      post({ jsonrpc: '2.0', method: 'ui/notifications/initialized' });
      finishConnect();
    } catch {
      finishConnect();
    }
  }
  let searching = false;
  async function runSearch(event) {
    event.preventDefault();
    if (searching) return;
    const query = queryField.value.trim();
    if (!query) {
      document.querySelector('#status').textContent = 'Enter a search query.';
      queryField.focus();
      return;
    }
    searching = true;
    const status = document.querySelector('#status');
    searchButton.disabled = true;
    status.textContent = 'Searching…';
    try {
      await ready;
      const args = { actions: [{ query, provider: providerField.value, limit: 8 }] };
      const fallback = () => withDeadline(window.openai.callTool('servo_web_search', args), 30_000);
      let result;
      if (!bridgeInitialized && typeof window.openai?.callTool === 'function') {
        result = await fallback();
      } else {
        try {
          result = await call('tools/call', { name: 'servo_web_search', arguments: args }, 30_000);
        } catch (error) {
          if (![-32601, 'HOST_TIMEOUT'].includes(error.code) || typeof window.openai?.callTool !== 'function') throw error;
          result = await fallback();
        }
      }
      if (result.isError) throw new Error(result.content?.[0]?.text || 'Search failed.');
      render(result.structuredContent);
    } catch (error) {
      status.textContent = String(error?.message ?? error);
    } finally {
      searching = false;
      searchButton.disabled = false;
      reportSize();
    }
  }
  document.querySelector('#search-form').addEventListener('submit', runSearch);
  searchButton.addEventListener('click', runSearch);
  connect();
</script>
</html>
