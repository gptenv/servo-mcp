<!doctype html>
<html lang="en" data-view="browser">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servo browser</title>
<style>
  :root { color-scheme: light dark; font: 14px/1.45 system-ui, sans-serif; }
  body { margin: 0; padding: 16px; }
  html[data-view="http"] #browser-view, html[data-view="browser"] #http-view { display: none; }
  #http-responses { overflow-wrap: anywhere; }
  #http-responses img { max-width: 100%; height: auto; }
  form { display: grid; gap: 10px; }
  label { display: grid; gap: 4px; }
  input, textarea, button { font: inherit; padding: 8px; }
  textarea { min-height: 90px; resize: vertical; }
  button { justify-self: start; cursor: pointer; }
  button:disabled { cursor: progress; }
  #status { min-height: 1.5em; }
  #preview[data-state="loaded"][src] { display: block; max-width: 100%; height: auto; border: 1px solid #8886; }
  #preview { display: none; }
  #preview:not([src]) { display: none; }
  pre { max-height: 14rem; overflow: auto; white-space: pre-wrap; }
</style>
<main id="browser-view">
  <h1>Servo browser</h1>
  <form id="browser-form">
    <label>Page URL <input id="url" type="url" placeholder="https://example.com" required></label>
    <label>Optional page script <textarea id="script" placeholder="document.title"></textarea></label>
    <button id="load" type="submit">Load and render</button>
  </form>
  <p>Session: <code id="session-id">none</code></p>
  <p id="status" role="status"></p>
  <img id="preview" alt="Screenshot rendered by Servo">
  <pre id="details"></pre>
</main>
<main id="http-view">
  <h1>HTTP response</h1>
  <div id="http-responses" aria-live="polite">Waiting for the response…</div>
</main>
<script>
  const pending = new Map();
  const buffered = [];
  let nextId = 1;
  let sessionId = null;
  let accepting = false;
  let bridgeReady = false;
  let bridgeInitialized = false;
  let suppressAutoShot = 0;
  let refreshing = false;
  const chatGlobals = {};
  let httpActions = [];
  let httpResponses;
  let httpShots = [];
  let lastWidth = 0;
  let lastHeight = 0;
  const urlField = document.querySelector('#url');
  const scriptField = document.querySelector('#script');
  const statusField = document.querySelector('#status');
  const sessionField = document.querySelector('#session-id');
  const preview = document.querySelector('#preview');
  const details = document.querySelector('#details');
  const loadButton = document.querySelector('#load');
  let readyResolve = () => {};
  const ready = new Promise((resolve) => { readyResolve = resolve; });

  urlField.addEventListener('input', () => { urlField.dataset.userEdited = '1'; });
  scriptField.addEventListener('input', () => { scriptField.dataset.userEdited = '1'; });

  function post(message) {
    if (!window.parent || window.parent === window) return;
    window.parent.postMessage(message, '*');
  }
  function withDeadline(promise, timeoutMs) {
    let timer;
    const timeout = new Promise((_, reject) => {
      timer = setTimeout(() => reject(Object.assign(new Error('Host request timed out.'), { code: 'HOST_TIMEOUT' })), timeoutMs);
    });
    return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
  }
  function call(method, params, timeoutMs) {
    const id = nextId++;
    const response = new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      post({ jsonrpc: '2.0', id, method, params });
    });
    return withDeadline(response, timeoutMs).finally(() => pending.delete(id));
  }
  function reportSize() {
    if (!bridgeReady) return;
    const width = Math.ceil(document.documentElement.scrollWidth);
    const height = Math.ceil(document.documentElement.scrollHeight);
    if (width === lastWidth && height === lastHeight) return;
    lastWidth = width;
    lastHeight = height;
    post({ jsonrpc: '2.0', method: 'ui/notifications/size-changed', params: { width, height } });
    const notify = window.openai && window.openai.notifyIntrinsicHeight;
    if (typeof notify === 'function') {
      try { notify(height); } catch { /* Host-specific height hints are optional. */ }
    }
  }
  function httpUrl(value) {
    try {
      const url = new URL(value);
      return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : '';
    } catch { return ''; }
  }
  function actionList(input) {
    if (Array.isArray(input?.actions) && input.actions.length) return input.actions.filter((entry) => entry && typeof entry === 'object');
    return input && typeof input === 'object' ? [input] : [];
  }
  function applyInput(params) {
    const input = params?.arguments ?? params ?? {};
    const actions = actionList(input);
    if (Array.isArray(input.actions)) {
      httpActions = actions;
      if (httpResponses) renderHttp(httpResponses);
    }
    const action = actions[0];
    if (!action) return;
    const url = httpUrl(action.url);
    if (url && urlField.dataset.userEdited !== '1') urlField.value = url;
    if (typeof action.script === 'string' && scriptField.dataset.userEdited !== '1') scriptField.value = action.script;
    if (typeof action.sessionID === 'string' && action.sessionID) {
      sessionId = action.sessionID;
      sessionField.textContent = sessionId;
    }
  }
  function screenshotList(result) {
    const found = [];
    const pushAll = (value) => { if (Array.isArray(value)) found.push(...value.filter((shot) => shot && typeof shot === 'object')); };
    pushAll(result?._meta?.ui?.screenshots);
    pushAll(result?._meta?.mcp_tool_result?._meta?.ui?.screenshots);
    pushAll(result?._meta?.call_tool_result?._meta?.ui?.screenshots);
    const parts = Array.isArray(result?.content) ? result.content : [];
    const responses = Array.isArray(result?.structuredContent?.responses) ? result.structuredContent.responses : [];
    parts.filter((part) => part?.type === 'image').forEach((part, imageIndex) => {
      if (typeof part.data !== 'string' || !part.data || !/^image\/(png|jpeg|webp|gif)$/.test(part.mimeType || '')) return;
      const entry = responses.find((entry) => entry?.response?.imageIndex === imageIndex);
      if (!entry && responses.length > 1) return;
      found.push({ mimeType: part.mimeType, data: part.data, imageIndex, sessionID: (entry ?? responses[0])?.sessionID });
    });
    return found;
  }
  function showScreenshot(shot) {
    const mimeType = shot.mimeType || 'image/png';
    const sources = [];
    if (typeof shot.data === 'string' && shot.data) sources.push('data:' + mimeType + ';base64,' + shot.data);
    if (typeof shot.url === 'string' && shot.url) sources.push(shot.url);
    if (!sources.length) return false;
    let index = 0;
    preview.alt = shot.sessionID ? 'Screenshot of session ' + shot.sessionID : 'Screenshot rendered by Servo';
    preview.dataset.state = 'loading';
    preview.onload = () => { preview.dataset.state = 'loaded'; reportSize(); };
    preview.onerror = () => {
      index += 1;
      if (index < sources.length) { preview.src = sources[index]; return; }
      preview.removeAttribute('src');
      preview.dataset.state = 'error';
      statusField.textContent = 'Screenshot could not be displayed.';
    };
    preview.src = sources[0];
    return true;
  }
  function preferredShot(shots) {
    if (!sessionId) return shots[0];
    return shots.find((shot) => shot.sessionID === sessionId) || shots.find((shot) => !shot.sessionID);
  }
  function pageOf(entry) {
    const page = entry?.response?.page;
    return page && typeof page === 'object' ? page : null;
  }
  function describe(result) {
    try {
      const clone = JSON.parse(JSON.stringify(result ?? null));
      const trim = (shot) => {
        if (!shot || typeof shot !== 'object') return;
        if (typeof shot.data === 'string') shot.data = '…' + shot.data.length + ' base64 chars';
        if (typeof shot.url === 'string') shot.url = 'hosted screenshot';
      };
      for (const shot of clone?._meta?.ui?.screenshots ?? []) trim(shot);
      for (const shot of clone?._meta?.mcp_tool_result?._meta?.ui?.screenshots ?? []) trim(shot);
      for (const shot of clone?._meta?.call_tool_result?._meta?.ui?.screenshots ?? []) trim(shot);
      if (Array.isArray(clone?.content)) for (const part of clone.content) if (part?.type === 'image' && typeof part.data === 'string') part.data = '…' + part.data.length + ' base64 chars';
      return JSON.stringify(clone, null, 2);
    } catch { return String(result); }
  }
  function firstResponse(result) {
    const responses = result?.structuredContent?.responses;
    if (!Array.isArray(responses) || !responses.length) return null;
    return responses.find((entry) => entry?.sessionID === sessionId) || responses[0];
  }
  async function refreshScreenshot(id) {
    if (!id || refreshing) return;
    refreshing = true;
    statusField.textContent = 'Capturing screenshot…';
    try {
      const rendered = await callTool('servo_screenshot', { actions: [{ sessionID: id }] });
      applyResult(rendered, false);
    } catch (error) {
      statusField.textContent = String(error?.message ?? error);
    } finally {
      refreshing = false;
      reportSize();
    }
  }
  function renderHttp(responses) {
    httpResponses = responses;
    const rows = document.querySelector('#http-responses');
    rows.replaceChildren();
    function requestField(labelText, value, multiline = false) {
      const label = document.createElement('label');
      const field = document.createElement(multiline ? 'textarea' : 'input');
      field.readOnly = true;
      field.value = value;
      label.append(labelText, field);
      return label;
    }
    for (const entry of responses) {
      const section = document.createElement('section');
      const heading = document.createElement('h2');
      const body = document.createElement('pre');
      const payload = entry.response;
      const input = httpActions[entry.actionIndex];
      const request = payload?.request ?? entry.request ?? input;
      section.append(heading);
      if (request?.url) {
        section.append(requestField('Request URL', request.url));
        if (request.method) section.append(requestField('Method', request.method));
      }
      if (input?.body !== undefined || input?.headers) {
        const params = document.createElement('details');
        const label = document.createElement('summary');
        label.textContent = 'Request details';
        params.append(label);
        if (input.headers) params.append(requestField('Request headers', JSON.stringify(input.headers, null, 2), true));
        if (input.body !== undefined) params.append(requestField('Request body', input.body, true));
        section.append(params);
      }
      if (entry.ok && payload?.response) {
        const response = payload.response;
        heading.textContent = [request.method, response.status, response.statusText].filter(Boolean).join(' ');
        if (response.url && response.url !== request.url) {
          const finalUrl = document.createElement('p');
          finalUrl.textContent = 'Final URL: ' + response.url;
          section.append(finalUrl);
        }
        const summary = payload.results?.[0];
        if (summary?.title) {
          const title = document.createElement('strong');
          title.textContent = summary.title;
          section.append(title);
        }
        const preview = summary?.content || payload.body;
        body.textContent = preview ? preview.slice(0, 20000) : response.bodyBytes
          ? 'Binary response (' + response.bodyBytes + ' bytes)' : 'No response body.';
        if (response.truncated || (payload.body?.length > 20000 && preview)) body.textContent += '\n… (preview truncated)';
      } else {
        heading.textContent = [request?.method, 'Request ' + (entry.actionIndex + 1) + ' failed'].filter(Boolean).join(' · ');
        body.textContent = entry.error || 'No HTTP response was received.';
      }
      section.append(body);
      if (entry.ok) {
        const shot = httpShots.find((item) => item.actionIndex === entry.actionIndex);
        const previewStatus = document.createElement('p');
        previewStatus.textContent = shot ? 'Loading response screenshot…' : 'Response screenshot unavailable.';
        section.append(previewStatus);
        if (shot) {
          const image = document.createElement('img');
          image.hidden = true;
          image.alt = 'Screenshot of HTTP response ' + (entry.actionIndex + 1);
          image.onload = () => { image.hidden = false; previewStatus.hidden = true; reportSize(); };
          image.onerror = () => {
            if (shot.url && image.src !== shot.url) { image.src = shot.url; return; }
            image.remove();
            previewStatus.textContent = 'Response screenshot unavailable.';
            reportSize();
          };
          section.append(image);
          image.src = shot.data ? 'data:image/png;base64,' + shot.data : shot.url;
        }
      }
      rows.append(section);
    }
    document.querySelector('#browser-view').hidden = true;
    document.documentElement.dataset.view = 'http';
    reportSize();
  }
  function applyResult(result, autoShot = true) {
    if (!result) return false;
    let data = result.structuredContent ?? (result.responses ? result : undefined);
    if (!data?.responses && Array.isArray(result.content)) {
      const text = result.content.find((part) => part.type === 'text')?.text;
      try { if (text) data = JSON.parse(text); } catch { /* Plain-text errors aren't JSON. */ }
    }
    result = { ...result, structuredContent: data };
    const incomingShots = result._meta?.ui?.screenshots;
    if (Array.isArray(incomingShots) && incomingShots.some((item) => Number.isInteger(item?.actionIndex))) {
      httpShots = incomingShots;
      if (!data?.responses && httpResponses) { renderHttp(httpResponses); return true; }
    }
    if (Array.isArray(data?.responses) && (data.kind === 'http' ||
        data.responses.some((entry) => entry?.response?.request && entry.response.response))) {
      renderHttp(data.responses);
      return true;
    }
    if (document.documentElement.dataset.view === 'http' && result.isError) {
      document.querySelector('#http-responses').textContent = result.content?.[0]?.text || 'The HTTP request failed.';
      reportSize();
      return false;
    }
    const entry = firstResponse(result);
    if (entry?.ok === false || (!entry && result.isError)) {
      statusField.textContent = resultError(result, 'Servo action failed.');
      details.textContent = describe(result);
      reportSize();
      return false;
    }
    if (entry?.sessionID) {
      sessionId = entry.sessionID;
      sessionField.textContent = sessionId;
    }
    const page = entry ? pageOf(entry) : result.structuredContent;
    const pageUrl = httpUrl(page?.url);
    if (pageUrl && urlField.dataset.userEdited !== '1') urlField.value = pageUrl;
    const shots = screenshotList(result);
    const shown = showScreenshot(preferredShot(shots) || {});
    if (autoShot && !shown && entry?.ok && entry.sessionID && page && suppressAutoShot === 0) refreshScreenshot(entry.sessionID);
    if (!entry && !data && !shown) return false;
    if (page) statusField.textContent = page.title || pageUrl || statusField.textContent || 'Rendered';
    else if (shown && !statusField.textContent) statusField.textContent = 'Rendered';
    details.textContent = describe(result);
    reportSize();
    return true;
  }
  function applyOpenAi(delta) {
    for (const key of ['toolInput', 'toolOutput', 'toolResponseMetadata']) {
      const value = delta?.[key] ?? window.openai?.[key];
      if (value != null) chatGlobals[key] = value;
    }
    if (chatGlobals.toolInput) applyInput(chatGlobals.toolInput);
    const meta = chatGlobals.toolResponseMetadata;
    const output = chatGlobals.toolOutput;
    const result = meta?.mcp_tool_result ?? meta?.call_tool_result ?? {};
    if (!output && !meta) return;
    applyResult({
      structuredContent: output?.structuredContent ?? (output?.responses ? output : result.structuredContent),
      content: output?.content ?? result.content ?? (Array.isArray(output) ? output : undefined),
      _meta: { ...meta, ...result._meta, ...output?._meta },
      isError: output?.isError ?? result.isError,
    });
  }
  function handle(message) {
    if (message.method === 'ui/notifications/tool-input' || message.method === 'ui/notifications/tool-input-partial') applyInput(message.params);
    if (message.method === 'ui/notifications/tool-result') applyResult(message.params);
    if (message.method === 'ui/notifications/tool-cancelled') statusField.textContent = message.params?.reason || 'The tool call was cancelled.';
    if (message.method === 'ui/notifications/host-context-changed' && message.params?.theme) document.documentElement.style.colorScheme = message.params.theme;
  }
  window.addEventListener('message', (event) => {
    if (event.source !== window.parent || event.source === window) return;
    const message = event.data;
    if (!message || message.jsonrpc !== '2.0') return;
    if (message.id !== undefined && pending.has(message.id)) {
      const request = pending.get(message.id);
      pending.delete(message.id);
      if (message.error) request.reject(Object.assign(new Error(message.error.message || 'Host request failed.'), { code: message.error.code }));
      else request.resolve(message.result);
      return;
    }
    if (message.id !== undefined && (message.method === 'ping' || message.method === 'ui/resource-teardown')) {
      post({ jsonrpc: '2.0', id: message.id, result: {} });
      return;
    }
    if (!message.method) return;
    if (!accepting && String(message.method).startsWith('ui/notifications/')) {
      buffered.push(message);
      return;
    }
    handle(message);
  });
  window.addEventListener('openai:set_globals', (event) => applyOpenAi(event.detail?.globals || window.openai));
  function finishConnect(result) {
    bridgeReady = true;
    accepting = true;
    if (result?.hostContext?.theme) document.documentElement.style.colorScheme = result.hostContext.theme;
    for (const message of buffered.splice(0)) handle(message);
    applyOpenAi();
    readyResolve();
    reportSize();
  }
  async function connect() {
    try {
      const result = await call('ui/initialize', {
        appInfo: { name: 'Servo browser', version: '0.5.0' },
        appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
        protocolVersion: '2026-01-26',
      }, 8_000);
      bridgeInitialized = true;
      post({ jsonrpc: '2.0', method: 'ui/notifications/initialized' });
      finishConnect(result);
    } catch {
      finishConnect(null);
    }
  }
  async function callTool(name, args) {
    await ready;
    suppressAutoShot += 1;
    try {
      if (!bridgeInitialized && typeof window.openai?.callTool === 'function') {
        return await withDeadline(window.openai.callTool(name, args), 90_000);
      }
      try {
        return await call('tools/call', { name, arguments: args }, 90_000);
      } catch (error) {
        const fallback = window.openai && window.openai.callTool;
        if (typeof fallback !== 'function' || (error?.code !== -32601 && !/method not found/i.test(String(error?.message || '')))) throw error;
        return await withDeadline(window.openai.callTool(name, args), 90_000);
      }
    } finally {
      suppressAutoShot -= 1;
    }
  }
  function resultError(result, fallback) {
    const entry = firstResponse(result);
    return entry?.error || result?.content?.find?.((part) => part?.type === 'text')?.text || fallback;
  }
  let loading = false;
  async function loadPage(event) {
    event.preventDefault();
    if (loading) return;
    if (!httpUrl(urlField.value)) {
      statusField.textContent = 'Enter a public http(s) URL.';
      return;
    }
    loading = true;
    loadButton.disabled = true;
    statusField.textContent = 'Loading page…';
    try {
      await ready;
      const navigated = await callTool('servo_navigate', {
        actions: [{ ...(sessionId ? { sessionID: sessionId } : {}), url: urlField.value }],
      });
      if (!applyResult(navigated, false)) throw new Error(resultError(navigated, 'Servo could not load the page.'));
      const script = scriptField.value.trim();
      let needsShot = !preferredShot(screenshotList(navigated));
      if (script) {
        if (!sessionId) throw new Error('Navigation did not return a session.');
        statusField.textContent = 'Running page script…';
        const evaluated = await callTool('servo_evaluate', { actions: [{ sessionID: sessionId, script }] });
        if (!applyResult(evaluated, false)) throw new Error(resultError(evaluated, 'Servo evaluation failed.'));
        needsShot = true;
      }
      if (needsShot) {
        if (!sessionId) throw new Error('Navigation did not return a session.');
        statusField.textContent = 'Capturing screenshot…';
        const rendered = await callTool('servo_screenshot', { actions: [{ sessionID: sessionId }] });
        if (!applyResult(rendered, false) || !preferredShot(screenshotList(rendered))) {
          throw new Error(resultError(rendered, 'Servo could not render the page.'));
        }
      }
    } catch (error) {
      statusField.textContent = String(error?.message ?? error);
    } finally {
      loading = false;
      loadButton.disabled = false;
      reportSize();
    }
  }
  document.querySelector('#browser-form').addEventListener('submit', loadPage);
  loadButton.addEventListener('click', loadPage);
  new ResizeObserver(() => reportSize()).observe(document.documentElement);
  applyOpenAi();
  connect();
</script>
</html>
