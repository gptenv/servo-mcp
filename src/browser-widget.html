<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servo browser</title>
<style>
  :root { color-scheme: light dark; font: 14px/1.45 system-ui, sans-serif; }
  body { margin: 0; padding: 16px; }
  form { display: grid; gap: 10px; }
  label { display: grid; gap: 4px; }
  input, textarea, button { font: inherit; padding: 8px; }
  textarea { min-height: 90px; resize: vertical; }
  button { justify-self: start; cursor: pointer; }
  #status { min-height: 1.5em; }
  #preview { display: block; max-width: 100%; border: 1px solid #8886; }
  pre { max-height: 14rem; overflow: auto; white-space: pre-wrap; }
</style>
<main>
  <h1>Servo browser</h1>
  <form id="browser-form">
    <label>Page URL <input id="url" type="url" placeholder="https://example.com" required></label>
    <label>Optional page script <textarea id="script" placeholder="document.title"></textarea></label>
    <button>Load and render</button>
  </form>
  <p id="status" role="status"></p>
  <img id="preview" alt="Screenshot rendered by Servo">
  <pre id="details"></pre>
</main>
<script>
  const pending = new Map();
  let nextId = 1;
  function call(method, params) {
    const id = nextId++;
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
    });
  }
  window.addEventListener('message', event => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== '2.0') return;
    if (message.id !== undefined && pending.has(message.id)) {
      const request = pending.get(message.id);
      pending.delete(message.id);
      message.error ? request.reject(message.error) : request.resolve(message.result);
      return;
    }
    if (message.method === 'ui/notifications/tool-result') render(message.params?.structuredContent);
    if (message.method === 'ui/notifications/tool-input') {
      const input = message.params?.arguments ?? message.params;
      if (input?.url) document.querySelector('#url').value = input.url;
    }
  });
  function render(result, content = []) {
    if (!result) return;
    document.querySelector('#status').textContent = result.title || result.url || 'Rendered';
    document.querySelector('#details').textContent = JSON.stringify(result, null, 2);
    const image = content.find(part => part.type === 'image' && part.mimeType === 'image/png');
    if (image) document.querySelector('#preview').src = `data:image/png;base64,${image.data}`;
  }
  document.querySelector('#browser-form').addEventListener('submit', async event => {
    event.preventDefault();
    const status = document.querySelector('#status');
    status.textContent = 'Loading page…';
    try {
      const result = await call('tools/call', { name: 'servo_run', arguments: {
        url: document.querySelector('#url').value,
        actions: [
          { type: 'snapshot' },
          ...(document.querySelector('#script').value
            ? [{ type: 'evaluate', script: document.querySelector('#script').value }]
            : []),
          { type: 'screenshot' },
        ],
      } });
      render(result.structuredContent, result.content);
      if (result.isError) status.textContent = 'Servo could not finish this request.';
    } catch (error) {
      status.textContent = String(error?.message ?? error);
    }
  });
</script>
</html>
